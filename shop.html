<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Flo On Wheels Cycles</title>
  <meta name="description" content="Browse Specialized bikes, e-bikes, parts and accessories at Flo On Wheels Cycles in Hoboken. Reserve online for in-store pickup.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Shop</h1>
        <p>Browse our bikes, parts and gear. Reserve anything online and pick it up at the shop. No payment needed until you're here.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="toolbar">
          <div class="chips" id="category-filters" role="group" aria-label="Filter by category"></div>
          <div class="toolbar-right">
            <label class="sr-only" for="search">Search products</label>
            <input id="search" type="search" placeholder="Search products…">
            <label class="sr-only" for="sort">Sort</label>
            <select id="sort">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
            <span id="result-count" aria-live="polite"></span>
          </div>
        </div>
        <div class="grid" id="product-grid"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
